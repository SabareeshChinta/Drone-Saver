[project]
name = "drone-saver"
version = "5.1.0"
description = "Drone Saver - Physics-Informed AI Digital Twin for Aero-Piston UAVs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0"
]

[tool.vercel]
entrypoint = "src.dashboard.server:app"
